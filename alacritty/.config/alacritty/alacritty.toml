import = [
    "~/.config/alacritty/themes/catpuccin_mocha.toml"
]

[window]
opacity = 0.9

[font]
normal.family = 'Iosevka Term'
italic.family = 'Iosevka Term'
bold.family = 'Iosevka Term'
size = 8 # or 19, to not show the bottom padding when using nvim

[terminal]
osc52 = 'CopyPaste'

[keyboard]
bindings = [
    { key = "Insert", mods = "Shift", action = "None" },
    { key = "0", mods = "Control", action = "None" }, # Instead of ResetFontSize
    { key = "=", mods = "Control", action = "None" }, # Instead of IncreaseFontSize
    { key = "+", mods = "Control", action = "None" }, # Instead of IncreaseFontSize
    { key = "-", mods = "Control", action = "None" }, # Instead of DecreaseFontSize
]
